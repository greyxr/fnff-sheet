name: Deploy to GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: python3 -m unittest
        working-directory: lambda
      - env:
          VITE_GROUP_API_URL: ${{ secrets.VITE_GROUP_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: test -n "$VITE_GROUP_API_URL" -a -n "$VITE_GOOGLE_CLIENT_ID" || { echo "Set the VITE_GROUP_API_URL and VITE_GOOGLE_CLIENT_ID repository secrets (Settings > Secrets and variables > Actions > Secrets)"; exit 1; }
      - env:
          VITE_GROUP_API_URL: ${{ secrets.VITE_GROUP_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - id: deployment
        uses: actions/deploy-pages@v4
